[project]
name = "payguard-backend"
version = "0.1.0"
description = "Agentic Guardian for Real-Time Payment Scam Interception"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.2",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "celery>=5.6.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
